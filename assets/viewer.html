<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__XRAY_TITLE__ · xray</title>
<style>
:root{
  --studio:#E3E8ED; --studio-deep:#CDD5DD; --ink:#18202A; --muted:#5A6573; --line:#C3CCD5;
  --panel:rgba(248,250,252,.88); --accent:#F2A100; --accent-ink:#8A5A00; --bad:#E0464C; --ok:#2E8B6E; --liquid:#2F78B5;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#AEB8C2;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#fit{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center;background:radial-gradient(120% 90% at 50% 35%,var(--studio) 0%,var(--studio-deep) 100%);overflow:hidden}
#gl{position:absolute;inset:0;width:1600px;height:900px;display:block}
#labels,#overlay{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;line-height:1.25;text-align:center;padding:3px 7px;border-radius:4px;background:rgba(248,250,252,.82);border:1px solid var(--line);pointer-events:auto;cursor:pointer;transition:opacity .25s}
.lbl b{font-weight:650;font-size:12.5px}
.lbl .m{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.lbl.hot{border-color:var(--accent);box-shadow:0 0 0 2px rgba(242,161,0,.25)}
.lbl.over{border-color:var(--bad);color:var(--bad)}
.lbl.over .m{color:var(--bad)}
.lbl.dim{opacity:.18}
.lbl.k-queue,.lbl.k-partner,.lbl.k-database,.lbl.k-bus{background:rgba(248,250,252,.66)}
.tag{position:absolute;transform:translate(-50%,-130%);font-size:12px;padding:4px 8px;border-radius:4px;background:var(--ink);color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.bad{background:var(--bad)}
.tag em{font-style:normal;color:#FFD480}

.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:7px;backdrop-filter:blur(6px)}
#head{left:20px;top:18px;width:330px;padding:16px 18px 14px}
#head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
#head .sub{margin:4px 0 12px;color:var(--muted);font-size:12.5px;line-height:1.4}
#big{font-size:54px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#big small{font-size:22px;font-weight:600;margin-left:3px;color:var(--muted)}
#bigcap{font-size:12px;color:var(--muted);margin-top:4px}
#kpis{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--muted)}
#kpis span b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
#kpis .bad b{color:var(--bad)}

#flows{left:20px;top:262px;width:330px;padding:12px}
.ph{font-size:12px;font-weight:650;color:var(--muted);margin:0 2px 8px}
.flow{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:5px;padding:8px 10px;margin:0 0 4px;font:inherit;cursor:pointer;color:var(--ink)}
.flow:hover{background:rgba(0,0,0,.035)}
.flow.on{border-color:var(--accent);background:rgba(242,161,0,.09)}
.flow .t{font-size:13.5px;font-weight:620}
.flow .c{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.flow .n{float:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

#ctl{left:20px;bottom:150px;width:330px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.row label{width:76px;color:var(--muted)}
.row output{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
input[type=range]{flex:1;accent-color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button.b{font:inherit;font-size:12px;padding:5px 9px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.b:hover{border-color:var(--ink)}
button.b.down{background:var(--bad);border-color:var(--bad);color:#fff}
button.b.on{background:var(--ink);border-color:var(--ink);color:#fff}

#gauges{right:20px;top:18px;width:300px;padding:12px 14px;max-height:600px;overflow:hidden}
.g{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.g .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .bar{height:7px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.g .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.g.warn .bar i{background:var(--accent)}
.g.over .bar i{background:var(--bad)} .g.over .v{color:var(--bad);font-weight:650}
.sep{height:1px;background:var(--line);margin:9px 0}
canvas.ch{width:272px;height:62px;display:block;margin-top:4px}
.chl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}
.chl b{color:var(--ink);font-variant-numeric:tabular-nums}

#insp{right:20px;top:18px;width:300px;padding:14px 16px;display:none;max-height:610px;overflow:auto}
#insp h2{margin:0 0 2px;font-size:19px}
#insp .p{font-size:12px;color:var(--muted);margin-bottom:10px;word-break:break-all}
#insp h3{font-size:12px;color:var(--muted);font-weight:650;margin:12px 0 4px}
#insp ul{list-style:none;margin:0;padding:0;font-size:12px}
#insp li{padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05)}
#insp li code,.ev code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
#insp .x{position:absolute;right:10px;top:8px}

#steps{left:370px;right:340px;bottom:18px;padding:10px 14px;min-height:112px}
#chips{display:flex;gap:4px;overflow:hidden;white-space:nowrap;margin-bottom:8px}
.chip{flex:0 0 auto;font-size:11px;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.05);color:var(--muted)}
.chip.done{color:var(--ink)}
.chip.now{background:var(--accent);color:#1d1400;font-weight:650}
.chip.fail{background:rgba(224,70,76,.12);color:var(--bad)}
.chip.fail.now{background:var(--bad);color:#fff}
#stepnow{font-size:15px;font-weight:640;min-height:20px}
#stepnow .k{font-weight:500;color:var(--muted);margin-right:6px}
.ev{margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev code.f{color:var(--ink);margin-right:8px}
#est{position:absolute;right:20px;bottom:18px;width:300px;padding:10px 14px;font-size:11.5px;color:var(--muted);line-height:1.4}
#est b{color:var(--ink)}

#cursor{position:absolute;left:0;top:0;width:22px;height:22px;pointer-events:none;z-index:20;opacity:0;transition:opacity .3s}
#cursor svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
#ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;opacity:0;z-index:19}
#mode{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);background:rgba(248,250,252,.7);padding:3px 9px;border-radius:10px;border:1px solid var(--line)}
.hidepanels .panel,.hidepanels #mode{display:none!important}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="gl" width="1600" height="900"></canvas>
  <div id="labels"></div>
  <div id="overlay"></div>

  <div id="head" class="panel">
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div id="big">–</div>
    <div id="bigcap"></div>
    <div id="kpis">
      <span><b id="k-rps">–</b>requests/s</span>
      <span id="k-bl"><b id="k-backlog">–</b>jobs waiting</span>
      <span id="k-fl"><b id="k-fail">0</b>failing/s</span>
    </div>
  </div>

  <div id="flows" class="panel"><div class="ph">Follow a request</div><div id="flowlist"></div></div>

  <div id="ctl" class="panel">
    <div class="ph">Push it</div>
    <div class="row"><label for="load">Traffic</label><input id="load" type="range" min="1" max="20" step="0.1" value="1"><output id="loadv">1×</output></div>
    <div class="row"><label for="speed">Replay speed</label><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><output id="speedv">1×</output></div>
    <div class="btns" id="outages"></div>
    <div class="btns" id="views"></div>
  </div>

  <div id="gauges" class="panel">
    <div class="ph">Live load</div>
    <div id="glist"></div>
    <div class="chl"><span id="c1l">Backlog</span><b id="c1v">0</b></div><canvas class="ch" id="c1" width="544" height="124"></canvas>
    <div class="chl"><span id="c2l">End to end</span><b id="c2v">–</b></div><canvas class="ch" id="c2" width="544" height="124"></canvas>
  </div>

  <div id="insp" class="panel"><button class="b x" id="inspx">Close</button><div id="inspbody"></div></div>

  <div id="steps" class="panel">
    <div id="chips"></div>
    <div id="stepnow"><span class="k"></span><span class="t">Pick a request on the left to follow it through the system.</span></div>
    <div class="ev" id="stepev"></div>
  </div>
  <div id="est" class="panel"></div>

  <div id="mode"></div>
  <div id="ripple"></div>
  <div id="cursor"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.5 14 L10.5 20.5 L13 19.4 L10.1 13 L16 13 Z" fill="#fff" stroke="#18202A" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
</div></div>

<script>/*__THREE__*/</script>
<script>
"use strict";
const DATA = /*__XRAY_DATA__*/null;
const { system: SYS, config: CFG, flows: FLOWS } = DATA;
const EST = CFG.estimates || {};
const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const fmtMs = (ms) => !isFinite(ms) ? "∞" : ms < 1000 ? [Math.round(ms), "ms"] : ms < 60000 ? [(ms / 1000).toFixed(ms < 10000 ? 2 : 1), "s"] : ms < 3600000 ? [(ms / 60000).toFixed(1), "min"] : [(ms / 3600000).toFixed(1), "h"];
const fmtN = (n) => n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : n >= 10 ? Math.round(n) + "" : n.toFixed(1);
const NODES = Object.fromEntries(SYS.nodes.map((n) => [n.id, n]));
const short = (id) => (NODES[id] ? NODES[id].label : id.split(":").pop());

/* =========================================================================
   MODEL — one pure model; scene, panels and labels all read from it.
   ========================================================================= */
const partnersIds = SYS.nodes.filter((n) => n.kind === "partner").map((n) => n.id);
const queueIds = SYS.nodes.filter((n) => n.kind === "queue").map((n) => n.id);
const serviceIds = SYS.nodes.filter((n) => n.kind === "service").map((n) => n.id);
const mixTotal = FLOWS.reduce((a, f) => a + ((CFG.traffic?.flowMix || {})[f.id] ?? 1), 0) || 1;
FLOWS.forEach((f) => {
  f.share = ((CFG.traffic?.flowMix || {})[f.id] ?? 1) / mixTotal;
  f.partners = [...new Set(f.steps.filter((s) => s.kind === "partner").map((s) => s.to))];
  const pIdx = f.steps.findIndex((s) => s.kind === "partner");
  f.failVariant = pIdx >= 0 ? [...f.steps.slice(0, pIdx + 1).map((s, i) => i === pIdx ? { ...s, failed: true } : s), ...f.failureSteps] : null;
});
const delayedQueues = new Set();
FLOWS.forEach((f) => f.steps.forEach((s) => { if (s.kind === "enqueue" && s.delayMs) delayedQueues.add(s.to); }));

function partnerMs(id, c) {
  const n = NODES[id] || {};
  if (c.outage[id]) {
    const retries = n.retries ?? (EST.partnerRetries || {})[id] ?? 3;
    return (n.timeoutMs || 15000) * retries;
  }
  return (EST.partnerLatencyMs || {})[id] ?? (EST.hopMs || {}).partner ?? 450;
}
function hopMs(s, c) {
  if (s.kind === "partner") return partnerMs(s.to, c);
  return (EST.hopMs || {})[s.kind] ?? ({ call: 1 })[s.kind] ?? 10;
}
// work a worker does per job on queue q: sync steps after the consume, by the consumer
const workCache = {};
function workSteps(q) {
  for (const f of FLOWS) {
    const steps = [...f.steps, ...f.failureSteps];
    const i = steps.findIndex((s) => s.kind === "consume" && s.from === q);
    if (i < 0) continue;
    const unit = steps[i].to, out = [];
    for (let j = i + 1; j < steps.length; j++) {
      const s = steps[j];
      if (s.kind === "consume" || s.kind === "deliver") break; // next async hop belongs to someone else
      if (s.from === unit && !s.branch && s.kind !== "call") out.push(s);
    }
    return out;
  }
  return null;
}
function workMs(q, c) {
  const ws = workSteps(q); if (!ws) return 50;
  return ((EST.hopMs || {}).consume ?? 25) + ws.filter((s) => ["emit", "enqueue", "db-read", "db-write", "partner"].includes(s.kind)).reduce((a, s) => a + hopMs(s, c), 0);
}
function concurrencyOf(q) { const n = NODES[q]; return (n && n.concurrency) || 1; }

function rates(c) {
  const base = (CFG.traffic?.baseRps ?? 8) * c.load;
  const node = {}, edge = {}, enq = {}, partnerCalls = {}; let failing = 0;
  const add = (o, k, v) => (o[k] = (o[k] || 0) + v);
  for (const f of FLOWS) {
    const r = base * f.share;
    const down = f.partners.some((p) => c.outage[p]);
    for (const s of f.steps) {
      add(edge, s.from + ">" + s.to, r);
      if (["http", "deliver", "consume", "call"].includes(s.kind)) add(node, s.to, r);
      if (s.kind === "enqueue") add(enq, s.to, r);
      if (s.kind === "partner") add(partnerCalls, s.to, r);
    }
    if (down) {
      const pi = f.steps.findIndex((s) => s.kind === "partner" && c.outage[s.to]);
      const qs = f.steps.slice(0, pi).filter((s) => s.kind === "enqueue" && !s.delayMs).map((s) => s.to);
      const gate = qs.length ? Math.min(...qs.map((q) => concurrencyOf(q) * 1000 / workMs(q, c))) : Infinity;
      failing += Math.min(r, gate);
      for (const s of f.failureSteps) { add(edge, s.from + ">" + s.to, r); if (s.kind === "deliver") add(node, s.to, r); } }
  }
  return { base, node, edge, enq, partnerCalls, failing };
}

function newSim() { return { t: 0, depth: Object.fromEntries(queueIds.map((q) => [q, 0])), hist: [], lastSample: -1 }; }
function simStep(S, c, dt) {
  const R = rates(c);
  for (const q of queueIds) {
    const lam = R.enq[q] || 0;
    if (delayedQueues.has(q)) {
      let delay = 0; FLOWS.forEach((f) => f.steps.forEach((s) => { if (s.to === q && s.delayMs) delay = Math.max(delay, s.delayMs); }));
      const target = lam * delay / 1000; S.depth[q] += (target - S.depth[q]) * (1 - Math.exp(-dt / 2.5));
      continue;
    }
    const mu = concurrencyOf(q) * 1000 / workMs(q, c);
    const out = Math.min(mu, lam + S.depth[q] / dt);
    S.depth[q] = Math.max(0, S.depth[q] + (lam - out) * dt);
  }
  S.t += dt;
  if (S.t - S.lastSample >= 0.25) {
    S.lastSample = S.t;
    const m = metrics(S, c);
    S.hist.push({ t: S.t, backlog: m.bottleneck ? S.depth[m.bottleneck] : 0, e2e: m.e2e });
    if (S.hist.length > 240) S.hist.shift();
  }
}
function metrics(S, c, flowIdx) {
  const R = rates(c);
  const util = {};
  for (const id of serviceIds) util[id] = (R.node[id] || 0) / (((EST.serviceCapacityRps || {})[id]) ?? 400);
  const qinfo = {};
  for (const q of queueIds) {
    const delayed = delayedQueues.has(q);
    const mu = delayed ? Infinity : concurrencyOf(q) * 1000 / workMs(q, c);
    qinfo[q] = { lam: R.enq[q] || 0, mu, depth: S.depth[q], delayed, util: delayed ? 0 : (R.enq[q] || 0) / mu, waitMs: delayed ? 0 : S.depth[q] / mu * 1000 };
  }
  let bottleneck = null, worst = -1;
  for (const q of queueIds) if (!qinfo[q].delayed && qinfo[q].util > worst) { worst = qinfo[q].util; bottleneck = q; }
  const f = FLOWS[flowIdx ?? 0];
  let e2e = 0;
  if (f) {
    for (const s of f.steps) {
      if (s.kind === "enqueue" && s.delayMs) break;
      let ms = hopMs(s, c);
      if (["http", "deliver", "consume"].includes(s.kind) && util[s.to] != null) { const rho = Math.min(util[s.to], 0.97); ms += ms * rho / (1 - rho); }
      if (s.kind === "enqueue" && qinfo[s.to]) ms += qinfo[s.to].waitMs;
      e2e += ms;
    }
  }
  const backlog = queueIds.filter((q) => !qinfo[q].delayed).reduce((a, q) => a + S.depth[q], 0);
  return { R, util, qinfo, bottleneck, e2e, backlog, failing: R.failing };
}

/* =========================================================================
   SCENE
   ========================================================================= */
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ canvas: $("#gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
const LOW = /[?&]low\b/.test(location.search);
renderer.setPixelRatio(LOW ? 1 : Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = !LOW;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, W / H, 0.5, 900);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa6b2, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(-18, 40, 26); sun.castShadow = !LOW;
sun.shadow.mapSize.set(LOW ? 512 : 2048, LOW ? 512 : 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 40, bottom: -40, near: 1, far: 140 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.13 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const COL = { graphite: 0x2a3038, graphite2: 0x343b45, plinth: 0xd7dde3, metal: 0xb7c0c9, accent: 0xf2a100, bad: 0xe0464c, liquid: 0x2f78b5, glass: 0xdfe8f0, light: 0xf3f5f7, edge: 0x9aa5b1 };
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.5, metalness: o.m ?? 0.15, transparent: true, opacity: o.op ?? 1, emissive: o.em ?? 0x000000 });

// ---------- layout ----------
const order = [];
FLOWS.forEach((f) => f.steps.forEach((s) => [s.from, s.to].forEach((id) => { if (NODES[id]?.kind === "service" && !order.includes(id)) order.push(id); })));
serviceIds.sort().forEach((id) => { if (!order.includes(id)) order.push(id); });
const pos = {};
const SP = 7.2;
const perRow = order.length > 8 ? Math.ceil(order.length / 2) : order.length;
order.forEach((id, i) => {
  const row = Math.floor(i / perRow), col = i % perRow, n = Math.min(perRow, order.length - row * perRow);
  pos[id] = new THREE.Vector3((col - (n - 1) / 2) * SP, 0, -row * 10);
});
const xs = order.map((id) => pos[id].x);
const minX = Math.min(...xs, 0), maxX = Math.max(...xs, 0);
const BUS_Z = 6.2, DB_Z = -9 - (order.length > 8 ? 10 : 0);
const clients = SYS.nodes.filter((n) => n.kind === "app" || n.kind === "external");
clients.forEach((n, i) => (pos[n.id] = new THREE.Vector3(minX - 11, 0, (i - (clients.length - 1) / 2) * 6)));
const parts = SYS.nodes.filter((n) => n.kind === "partner");
parts.forEach((n, i) => (pos[n.id] = new THREE.Vector3(maxX + 13, 0, (i - (parts.length - 1) / 2) * 7 - 1)));
const DBS = SYS.nodes.filter((n) => n.kind === "database");
DBS.forEach((n, i) => (pos[n.id] = new THREE.Vector3((i - (DBS.length - 1) / 2) * 9, 0, DB_Z)));
if (NODES["bus:events"]) pos["bus:events"] = new THREE.Vector3(0, 0.45, BUS_Z);
const qByOwner = {};
queueIds.forEach((q) => {
  const owner = NODES[q].owner; const k = (qByOwner[owner] = (qByOwner[owner] || 0) + 1) - 1;
  const o = pos[owner] || new THREE.Vector3(0, 0, 0);
  pos[q] = new THREE.Vector3(o.x + 2.6 + k * 1.9, 0, o.z + 3.3);
});

// ---------- node meshes ----------
const objs = {}; // id -> { group, mats:[], anchorY, floors:[], liquid, cap }
function reg(id, group, anchorY) { objs[id] = { group, mats: [], anchorY, floors: [] }; group.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.userData.node = id; objs[id].mats.push(o.material); } }); scene.add(group); return objs[id]; }

    const side = NODES[id].kind === "queue"; const w = d.offsetWidth, h = d.offsetHeight; const x = parseFloat(d.style.left), y = parseFloat(d.style.top);
    let pr = PR[NODES[id].kind] || 10; if (d.classList.contains("over")) pr += 100; if (d.classList.contains("hot")) pr += 80; if (id === focus) pr += 200;
    items.push({ id, d, side, w, h, x, y, pr });
  }
  items.sort((a, b) => b.pr - a.pr);
  const placed = [];
  const hit = (r) => placed.some((q) => r.x < q.x + q.w + 3 && r.x + r.w + 3 > q.x && r.y < q.y + q.h + 2 && r.y + r.h + 2 > q.y);
  for (const it of items) {
    const base = it.side ? { x: it.x + 6, y: it.y - it.h / 2 } : { x: it.x - it.w / 2, y: it.y - it.h };
    let ok = null;
    for (const dy of [0, -1, 1, -2, 2]) { const r = { x: base.x, y: base.y + dy * (it.h + 3), w: it.w, h: it.h }; const inside = r.x >= 4 && r.y >= 4 && r.x + r.w <= W - 4 && r.y + r.h <= H - 4; if (inside && !hit(r)) { ok = { r, dy }; break; } }
    if (ok) { placed.push(ok.r); it.d.style.top = it.y + ok.dy * (it.h + 3) + "px"; it.d.style.visibility = ""; }
    else it.d.style.visibility = "hidden";
  }

  // floor labels while exploded
  if (focus && NODES[focus].kind === "service" && UI.explode > 0.3) {
    const o = objs[focus];
    o.floors.forEach((f, i) => {
      let el = f.userData.el; if (!el) { el = f.userData.el = document.createElement("div"); el.className = "lbl"; el.style.transform = "translate(0,-50%)"; el.innerHTML = "<b></b>"; el.querySelector("b").textContent = f.userData.domain; labelBox.appendChild(el); }
      const p = proj(pos[focus].clone().add(new THREE.Vector3(1.85, f.position.y, 1.4)));
      el.style.display = ""; el.style.left = p.x + 8 + "px"; el.style.top = p.y + "px"; el.style.opacity = UI.explode;
    });
  }
  Object.values(objs).forEach((o) => o.floors.forEach((f) => { if (f.userData.el && (!focus || objs[focus] !== o || UI.explode <= 0.3)) f.userData.el.style.display = "none"; }));

  // ----- step panel + tag
  if (cur) {
    const [t1, t2] = sentence(cur.s);
    $("#stepnow .k").textContent = `${cur.i + 1}/${UI.sched.items.length}`; $("#stepnow .t").textContent = t1 + " · " + t2;
    const e = cur.s.evidence;
    $("#stepev").innerHTML = e ? `<code class="f">${esc(e.file)}:${e.line}</code><code>${esc(e.code || "")}</code>` : "";
    [...$("#chips").children].forEach((c, i) => { c.classList.toggle("now", i === cur.i); c.classList.toggle("done", i < cur.i); });
    const nowChip = $("#chips").children[cur.i]; if (nowChip) $("#chips").scrollLeft = Math.max(0, nowChip.offsetLeft - 200);
    if (showP) {
      const p = proj(packet.position.clone());
      const ms = hopMs(cur.s, UI);
      tagEl.style.display = ""; tagEl.className = "tag" + (cur.s.failed || cur.s.branch === "failure" ? " bad" : "");
      tagEl.style.left = p.x + "px"; tagEl.style.top = p.y - 10 + "px";
      tagEl.innerHTML = `${esc(cur.s.label)} <em>${fmtMs(ms).join(" ")}${cur.s.kind === "partner" && UI.outage[cur.s.to] ? " (timeouts)" : ""}</em>`;
    } else tagEl.style.display = "none";
  } else {
    tagEl.style.display = "none";
    const beat = (mode === "tour" || mode === "record") ? UI._beat : null;
    const cap = beat && !UI.sched ? beatCaption(beat, M) : null;
    if (cap) { $("#stepnow .k").textContent = ""; $("#stepnow .t").textContent = cap[0]; $("#stepev").innerHTML = cap[1]; }
    else if (!UI.sched) { $("#stepnow .k").textContent = ""; $("#stepnow .t").textContent = "Pick a request on the left to follow it through the system."; $("#stepev").innerHTML = ""; }
  }
  document.querySelectorAll(".flow").forEach((b, i) => b.classList.toggle("on", UI.flow === i && !!UI.sched && UI.flowT <= UI.sched.total));

  // ----- head panel
  const [bv, bu] = fmtMs(M.e2e);
  $("#big").innerHTML = `${bv}<small>${bu}</small>`;
  $("#bigcap").textContent = `${FLOWS[fi]?.title || ""}, end to end (est.)`;
  $("#k-rps").textContent = fmtN(M.R.base);
  $("#k-backlog").textContent = fmtN(M.backlog); $("#k-bl").classList.toggle("bad", M.backlog > 50);
  $("#k-fail").textContent = fmtN(M.failing); $("#k-fl").classList.toggle("bad", M.failing > 0);
  $("#loadv").textContent = (+UI.load).toFixed(UI.load < 10 ? 1 : 0) + "×";

  // ----- gauges
  for (const [id, row] of Object.entries(gRows)) {
    const k = NODES[id].kind; let frac = 0, txt = "";
    if (k === "service") { frac = M.util[id] || 0; txt = Math.round(frac * 100) + "%"; }
    else if (k === "queue") { const q = M.qinfo[id]; frac = q.delayed ? 0.1 : q.util; txt = fmtN(q.depth); }
    else if (k === "partner") { frac = UI.outage[id] ? 1.2 : clamp((M.R.partnerCalls[id] || 0) / 60, 0, 1); txt = UI.outage[id] ? "down" : fmtN(M.R.partnerCalls[id] || 0) + "/s"; }
    row.querySelector("i").style.width = clamp(frac, 0.02, 1) * 100 + "%";
    row.classList.toggle("warn", frac > 0.7 && frac <= 1); row.classList.toggle("over", frac > 1);
    row.querySelector(".v").textContent = txt;
  }
  const bq = M.bottleneck;
  $("#c1l").textContent = bq ? `Backlog · ${short(bq)}` : "Backlog";
  $("#c1v").textContent = bq ? fmtN(S.depth[bq]) + " jobs" : "–";
  $("#c2l").textContent = `End to end · ${FLOWS[fi]?.title || ""}`; $("#c2v").textContent = fmtMs(M.e2e).join(" ");
  drawChart($("#c1"), S.hist.map((h) => h.backlog), M.backlog > 50 ? "#E0464C" : "#18202A");
  drawChart($("#c2"), S.hist.map((h) => h.e2e), "#8A5A00", true);
}
function drawChart(cv, vals, color, log) {
  const g = cv.getContext("2d"), w = cv.width, h = cv.height; g.clearRect(0, 0, w, h);
  g.strokeStyle = "rgba(0,0,0,.08)"; g.lineWidth = 1; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, (h * i) / 4); g.lineTo(w, (h * i) / 4); g.stroke(); }
  if (vals.length < 2) return;
  const f = (v) => (log ? Math.log10(1 + v) : v);
  const mx = Math.max(...vals.map(f), log ? 3 : 10);
  g.beginPath(); vals.forEach((v, i) => { const x = (i / 239) * w, y = h - 6 - (f(v) / mx) * (h - 14); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = color; g.lineWidth = 3; g.stroke();
}

/* =========================================================================
   LOOP + recording hooks
   ========================================================================= */
let REC_T = 0, last = performance.now() / 1000;
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})`; }
addEventListener("resize", fit); fit();
// warm every shader before the first visible frame
renderer.compile(scene, camera);
function loop() {
  const now = performance.now() / 1000; const dt = Math.min(0.1, now - last); last = now;
  if (mode !== "record") frame(now, dt);
  requestAnimationFrame(loop);
}
window.__xray = {
  duration: TOUR_LEN, beats: BEATS.map(({ kind, t0, dur }) => ({ kind, t0, dur })),
  renderAt(t) { mode = "record"; REC_T = t; frame(t, 1 / 60); return true; },
  hiddenImportant() { return Object.entries(labels).filter(([, d]) => d.style.visibility === "hidden" && (d.classList.contains("over") || d.classList.contains("hot"))).map(([id]) => id); },
  labelRects() { return Object.entries(labels).filter(([, d]) => d.style.display !== "none" && d.style.visibility !== "hidden" && !d.classList.contains("dim")).map(([id, d]) => { const r = d.getBoundingClientRect(); return { id, x: r.left, y: r.top, w: r.width, h: r.height }; }); },
  ready: true,
};
requestAnimationFrame(loop);
</script>
